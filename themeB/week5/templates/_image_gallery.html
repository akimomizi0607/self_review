{% if image_names %}
    <p>画像をクリックすると別タブで開きます。</p>
    <div class="post-images">
        {% for image_name in image_names %}
            <a class="post-image-link"
               href="{{ url_for('static', filename='uploads/' + image_name) }}"
               target="_blank" rel="noopener noreferrer">
                <img src="{{ url_for('static', filename='uploads/' + image_name) }}"
                     alt="添付画像 {{ loop.index }}">
            </a>
        {% endfor %}
    </div>
{% endif %}
