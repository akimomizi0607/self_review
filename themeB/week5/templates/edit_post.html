<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ thread_name }} — 投稿の編集</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='post.css') }}">
</head>
<body>
    <h1>投稿内容の編集</h1>
    <form method="post" action="{{ url_for('edit_post', thread_name=thread_name) }}"
            enctype="multipart/form-data">
        <input type="hidden" name="post_id" value="{{ post.id }}">
        <fieldset style="width: fit-content;">
            <legend>星評価</legend>
            {% for score in range(1, 6) %}
            <label>
                <input type="radio" name="rating" value="{{ score }}"
                    {% if post.rating|string == score|string %}checked{% endif %}>
                ★{{ score }}
            </label>
            {% endfor %}
        </fieldset>
        <p>
            <label for="headtext">見出し</label><br>
            <input type="text" id="headtext" name="headtext"
                value="{{ post.headtext }}">
        </p>
        <p>
            <label for="bodytext">内容</label><br>
            <textarea id="bodytext" name="bodytext"
                    rows="5" cols="40">{{ post.bodytext }}</textarea>
        </p>
        <div id="existing-images">
            {% with image_names=post.get("image_names", []) %}
                {% include "_image_gallery.html" %}
            {% endwith %}
        </div>
        <p>
            <label for="images">差し替える画像（任意・最大4枚・各5MB・JPG／PNG）</label><br>
            <input type="file" id="images" name="images" accept=".jpg,.jpeg,.png" multiple>
        </p>
        <div id="replacement-preview" hidden>
            <div id="replacement-images" class="post-images"></div>
        </div>
        <button class="nav-button" type="submit">変更内容を確認</button>
    </form>
    <a class="nav-button"
        href="{{ url_for('select_edit', thread_name=thread_name) }}">選択画面に戻る</a>
    <script>
        const imageInput = document.getElementById("images");
        const existingImages = document.getElementById("existing-images");
        const replacementPreview = document.getElementById("replacement-preview");
        const previews = document.getElementById("replacement-images");

        imageInput.addEventListener("change", () => {
            const hasReplacement = imageInput.files.length > 0;
            existingImages.hidden = hasReplacement;
            replacementPreview.hidden = !hasReplacement;
            previews.replaceChildren();

            for (const file of imageInput.files) {
                const frame = document.createElement("span");
                frame.className = "post-image-link";
                const image = document.createElement("img");
                image.alt = file.name;
                frame.appendChild(image);
                previews.appendChild(frame);
                const reader = new FileReader();
                reader.addEventListener("load", () => {
                    image.src = reader.result;
                });
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
