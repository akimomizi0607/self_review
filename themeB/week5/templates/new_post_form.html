{% extends "base_layout.html" %}

{% block page_title %}{{ thread_name }} — 自分レビュー{% endblock %}

{% block page_content %}
    <h1>{{ thread_name }}</h1>
    <p>新しい投稿を入力してください。</p>
    <form method="post"
          action="{{ url_for('confirm_post', thread_name=thread_name) }}"
          enctype="multipart/form-data">
        <fieldset class="star-rating-options">
            <legend>星評価</legend>
            {% for rating_score in range(1, 6) %}
                <label>
                    <input type="radio" name="rating" value="{{ rating_score }}">
                    ★{{ rating_score }}
                </label>
            {% endfor %}
        </fieldset>
        <p>
            <label for="post-heading-input">見出し</label><br>
            <input type="text" id="post-heading-input" name="headtext" placeholder="日向ぼっこ">
        </p>
        <p>
            <label for="post-body-input">内容（任意）</label><br>
            <textarea id="post-body-input" name="bodytext" rows="5" cols="40"
                      placeholder="今日は公園へ行った。"></textarea>
        </p>
        <p>
            <label for="post-image-input">画像（任意・JPG/PNG）</label><br>
            <input type="file" id="post-image-input" name="images"
                   accept=".jpg,.jpeg,.png" multiple
                   data-image-preview-target="selected-image-previews">
        </p>
        <div id="selected-image-previews"></div>
        <button class="navigation-button" type="submit">入力内容を確認</button>
    </form>
    <a class="navigation-button" href="{{ url_for('show_thread', thread_name=thread_name) }}">記事一覧に戻る</a>
{% endblock %}

{% block page_scripts %}
    <script src="{{ url_for('static', filename='image_attachment_preview.js') }}"></script>
{% endblock %}
