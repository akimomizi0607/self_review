<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分レビュー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='post.css') }}">
</head>

<body>
    <h1>自分レビュー</h1>

    <!-- 今日の情報 -->
    <p>今日の日付：{{ today }}｜今日の投稿数：{{ today_count }}件</p>

    <!-- 全体評価と日別平均のグラフ -->
    {% if overall_average is none %}
        <p>全体評価：まだ投稿がありません</p>
    {% endif %}

    {% if chart_dates %}
        <h2>全体評価：★ {{ overall_average | round(2) }}</h2>
        <div style="max-width: 640px;">
            <canvas id="rating-chart"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            new Chart(document.getElementById("rating-chart"), {
                type: "line",
                data: {
                    labels: JSON.parse('{{ chart_dates | tojson }}'),
                    datasets: [
                        {
                            label: "日別平均（左軸・星）",
                            data: JSON.parse('{{ chart_averages | tojson }}')
                        },
                        {
                            type: "bar",
                            label: "投稿数（右軸・件）",
                            data: JSON.parse('{{ chart_counts | tojson }}'),
                            yAxisID: "y1"
                        }
                    ]
                },
                options: {
                    scales: {
                        y: {
                            position: "left",
                            min: 1,
                            max: 5
                        },
                        y1: {
                            position: "right",
                            beginAtZero: true,
                            ticks: { stepSize: 1 },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        </script>
    {% endif %}

    <!-- スレッド一覧と操作ボタン -->
    <div class="thread-list-heading">
        <h2>マイスレッド</h2>
        <a class="nav-button" href="{{ url_for('new_thread') }}">新規スレッド</a>
        <a class="nav-button" href="{{ url_for('select_thread_delete') }}">スレッドの削除</a>
    </div>

    <div class="thread-links">
        {% for thread in threads %}
            <p>
                <a class="nav-button" href="{{ url_for('show_thread', thread_name=thread.name) }}">
                    {{ thread.name }}
                </a>
            </p>
        {% endfor %}
    </div>
</body>

</html>
