<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ thread_name }} — 自分レビュー</title>
</head>
<body>
    <h1>{{ thread_name }}</h1>
    <p>このスレッドの投稿をここに表示します。</p>
    <fieldset style="width: fit-content;">
    <legend>星評価</legend>
    {% for score in range(1, 6) %}
    <label>
        <input type="radio" name="rating" value="{{ score }}">
        ★{{ score }}
    </label>
    {% endfor %}
</fieldset>

<p>
    <label for="subject">見出し</label><br>
    <input type="text" id="subject" name="subject"
        placeholder="日向ぼっこ">
</p>

<p>
    <label for="body">内容</label><br>
    <textarea id="body" name="body" rows="5" cols="40"
        placeholder="今日は公園へ行った。"></textarea>
</p>
    <a href="{{ url_for('index') }}">スレッド一覧に戻る</a>
</body>
</html>
