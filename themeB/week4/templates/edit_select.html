<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ thread_name }} — 投稿の編集</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='post.css') }}">
</head>
<body>
    <h2>投稿の編集</h2>
    <p>投稿から2時間以内の投稿を表示しています。</p>
    <form method="get" action="{{ url_for('edit_post', thread_name=thread_name) }}">
        {% for post in thread_posts|reverse %}
        <article class="post-card">
            <label>
                <input type="radio" name="post_id" value="{{ post.id }}" required>
                この投稿を選ぶ
            </label>
            <h3>{{ post.headtext }}</h3>
            <p>{{ post.created_at }} ／ 星評価：★{{ post.rating }}</p>
            <p class="post-body">{{ post.bodytext }}</p>
        </article>
        {% else %}
        <p>編集できる投稿はありません。</p>
        {% endfor %}
        {% if thread_posts %}
        <button class="nav-button" type="submit">選んだ投稿を編集</button>
        {% endif %}
    </form>

    <a class="nav-button"
        href="{{ url_for('show_thread', thread_name=thread_name) }}">スレッドに戻る</a>
</body>
</html>
