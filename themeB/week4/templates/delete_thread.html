<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スレッドの削除 — 自分レビュー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='post.css') }}">
</head>
<body>
<h1>スレッドの削除</h1>
{% if threads|length > 1 %}
<form method="post" action="{{ url_for('confirm_thread_delete') }}">
    <div class="delete-selection-heading">
        <h2>削除するスレッドを1件選んでください</h2>
    </div>
{% for thread in threads %}
<p>
    <label>
        <input type="radio" name="thread_id" value="{{ thread.id }}" required>
        {{ thread.name }}
    </label>
</p>
{% endfor %}
<p>
    <button class="nav-button" type="submit">選択したスレッドを確認</button>
    <a class="nav-button" href="{{ url_for('index') }}">マイスレッドに戻る</a>
</p>
</form>
{% else %}
<p>スレッドが2件以上あるときに削除できます。</p>
<p>
    <a class="nav-button" href="{{ url_for('index') }}">マイスレッドに戻る</a>
</p>
{% endif %}
</body>
</html>
