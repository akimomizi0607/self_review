<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分レビュー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='post.css') }}">
</head>
<body>
    <h1>自分レビュー</h1>
    <p>今日の日付：{{ today }}</p>
    <p>今までの記録を振り返ろう</p>
    <div class="thread-list-heading">
        <h2>マイスレッド</h2>
        <a class="nav-button" href="{{ url_for('new_thread') }}">新規スレッド</a>
        <a class="nav-button" href="{{ url_for('select_thread_delete') }}">スレッドの削除</a>
    </div>
    <div class="thread-links">
        {% for thread in threads %}
        <p>
            <a class="nav-button" href="{{ url_for('show_thread', thread_name=thread.name) }}">{{ thread.name }}</a>
        </p>
        {% endfor %}
    </div>
</body>
</html>
